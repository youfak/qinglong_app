name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with this APK'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'
          cache: true

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle files from Flutter template..."
            flutter create /tmp/temp_project --platforms=android
            cp /tmp/temp_project/android/gradlew android/
            chmod +x android/gradlew
            mkdir -p android/gradle/wrapper
            if [ -f "/tmp/temp_project/android/gradle/wrapper/gradle-wrapper.jar" ]; then
              cp /tmp/temp_project/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/
            fi
            rm -rf /tmp/temp_project
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fallback: Downloading gradle-wrapper.jar directly..."
            curl -sLO https://services.gradle.org/distributions/gradle-6.7-bin.zip
            unzip -q -o gradle-6.7-bin.zip "*gradle-wrapper*"
            find . -name "*gradle-wrapper*.jar" -exec cp {} android/gradle/wrapper/gradle-wrapper.jar \;
            rm -rf gradle-6.7*
          fi

      - name: Ensure Keystore exists
        run: |
          if [ -f "android/app/qinglong.keystore" ]; then
            echo "Keystore found in repository."
          else
            echo "Restoring permanent release keystore from base64..."
            echo "" | base64 -d > android/app/qinglong.keystore
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qinglong-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
